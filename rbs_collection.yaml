sources:
  - type: git
    name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    revision: main
    repo_dir: gems

path: .gem_rbs_collection

# These gems ship no RBS and are covered by the hand-written stubs in sig/shims.
gems:
  - name: mcp
    ignore: true
  - name: dotenv
    ignore: true
  - name: json_schemer
    ignore: true

# Stdlib the client uses directly; Bundler doesn't see these, so the collection has to be told.
  - name: net-http
  - name: openssl
  - name: socket
  - name: timeout
