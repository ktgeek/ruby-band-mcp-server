name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rubocop

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rbs collection install
      - run: bundle exec rake rbs:drift
      - run: bundle exec steep check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rspec

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rake audit

  # Builds the gem and runs the installed executable, which catches a file missing from spec.files.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: gem build band-mcp-server.gemspec
      - name: Smoke-test the installed gem
        run: |
          export GEM_HOME="$RUNNER_TEMP/gems" GEM_PATH="$RUNNER_TEMP/gems"
          gem install --no-document ./band-mcp-server-*.gem
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' |
            "$GEM_HOME/bin/band-mcp-server" | grep -q '"serverInfo"'

  # Builds the Dockerfile against the newest published gem (the image installs from RubyGems, not the checkout), which
  # catches a base image or USER problem before a release tag does.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: |
          version="$(gem list --remote --exact band-mcp-server | sed -E 's/^band-mcp-server \(([^)]+)\)$/\1/')"
          docker build --build-arg VERSION="$version" --tag band-mcp-server:ci .
      - name: Smoke-test the image
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' |
            docker run -i --rm band-mcp-server:ci | grep -q '"serverInfo"'
