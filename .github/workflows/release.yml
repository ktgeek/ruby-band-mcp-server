name: Release

on:
  push:
    tags: ["v*"]
  # Rebuilds the image for a version that is already on RubyGems, e.g. after a failed `image` job. It does not
  # release the gem.
  workflow_dispatch:
    inputs:
      version:
        description: Gem version to build the image for, without the leading v
        required: true

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # RubyGems trusted publishing (OIDC); no API key is stored.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Check the tag matches the gem version
        run: |
          version="$(bundle exec ruby -Ilib -e 'require "band_mcp/version"; puts BandMCP::VERSION')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version" >&2; exit 1; }
      - run: bundle exec rbs collection install
      - run: bundle exec rake
      - run: gem build band-mcp-server.gemspec
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - run: gem push band-mcp-server-*.gem

  image:
    needs: release
    # A manual run skips `release`, which would otherwise skip this job too.
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Push to ghcr.io with the workflow's GITHUB_TOKEN.
    env:
      IMAGE: ghcr.io/ktgeek/band-mcp-server
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the gem to reach the RubyGems index
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # Only a plain X.Y.Z release moves `latest`; a prerelease such as 1.1.0.rc1 must not.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "STABLE=true" >> "$GITHUB_ENV"; else echo "STABLE=false" >> "$GITHUB_ENV"; fi
          for attempt in $(seq 1 20); do
            gem specification band-mcp-server --version "$version" --remote >/dev/null 2>&1 && exit 0
            echo "band-mcp-server $version not indexed yet (attempt $attempt)"
            sleep 15
          done
          echo "band-mcp-server $version never appeared on RubyGems" >&2
          exit 1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ env.STABLE }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

  # The registry checks the image and its label, so this waits for `image`. A manual image rebuild does not republish.
  registry:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # MCP Registry GitHub OIDC login; no secret is stored.
    env:
      MCP_PUBLISHER_VERSION: v1.8.4
    steps:
      - uses: actions/checkout@v7
      - name: Stamp the tag's version into server.json
        id: stamp
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A prerelease such as 1.1.0.rc1 is not semver, which the registry expects, and gets no `latest` image tag.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not publishing prerelease $version to the MCP Registry"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stable=true" >> "$GITHUB_OUTPUT"
          jq --arg v "$version" '.version = $v | .packages[0].identifier |= sub(":[^:]*$"; ":" + $v)' server.json > server.tmp
          mv server.tmp server.json
          cat server.json
      - if: steps.stamp.outputs.stable == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        if: steps.stamp.outputs.stable == 'true'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - if: steps.stamp.outputs.stable == 'true'
        run: ./mcp-publisher login github-oidc
      - if: steps.stamp.outputs.stable == 'true'
        run: ./mcp-publisher publish
