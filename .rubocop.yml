plugins:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - vendor/**/*
    - .gem_rbs_collection/**/*

Metrics:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# rbs-inline annotations are written as `#:` comments.
Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true
